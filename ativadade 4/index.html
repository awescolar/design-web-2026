<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 4 - Hierarquia de Texto</title>
  
  <!-- CDN do Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <!-- Container (Requisitos: max-w-sm, rounded, shadow, p-4, bg-white, border) -->
  <div class="max-w-sm rounded shadow p-4 bg-white border">
    
    <!-- Título com palavra destacada (Desafio: amber-500) -->
    <h1 class="text-2xl font-black text-gray-900 mb-1">
      Guias de <span class="text-amber-500">Vôlei</span> de Praia
    </h1>

    <!-- Subtítulo -->
    <h2 class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wide">
      Edição Internacional
    </h2>

    <!-- Texto corrido -->
    <p class="text-sm font-light text-gray-700 leading-relaxed">
      Aprenda as melhores estratégias e acompanhe o circuito mundial das duplas em destaque nesta temporada.
    </p>

  </div>

</body>
</html>
