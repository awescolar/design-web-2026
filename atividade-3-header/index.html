<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header IFRN</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 m-0 p-0 font-sans">

  <header class="w-full bg-[#39804e] text-white shadow-sm font-sans">
    <div class="max-w-7xl mx-auto px-6 py-3.5">
      
      <div class="flex items-center justify-between gap-4 flex-wrap">
        
        <div class="flex items-center gap-6">
          <a href="#" class="flex items-center gap-3.5 no-underline text-white">
            <div class="grid grid-cols-3 gap-1 w-8 h-[38px] shrink-0">
              <span class="bg-[#e30613] rounded-full"></span>
              <span class="bg-white rounded-[2px]"></span>
              <span class="bg-white rounded-[2px]"></span>
              <span class="bg-white rounded-[2px]"></span>
              <span class="bg-white rounded-[2px]"></span>
              <span class="bg-white rounded-[2px]"></span>
              <span class="bg-white rounded-[2px]"></span>
              <span class="bg-white rounded-[2px]"></span>
              <span class="bg-white rounded-[2px]"></span>
            </div>
            <div class="leading-tight">
              <span class="block text-sm font-bold tracking-tight uppercase">INSTITUTO FEDERAL</span>
              <span class="block text-[11px] font-normal text-white/95">Rio Grande do Norte</span>
            </div>
          </a>

          <p class="hidden lg:block text-[11px] text-white/90 max-w-[210px] leading-snug">
            Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
          </p>
        </div>

        <div class="flex items-center gap-3.5">
          
          <ul class="hidden xl:flex items-center gap-2 list-none m-0 p-0">
            <li>
              <a href="#" class="w-7 h-7 rounded-full border border-white/80 flex items-center justify-center hover:bg-white/20 transition text-white" title="Instagram">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              </a>
            </li>
            <li>
              <a href="#" class="w-7 h-7 rounded-full border border-white/80 flex items-center justify-center hover:bg-white/20 transition text-white" title="X">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              </a>
            </li>
            <li>
              <a href="#" class="w-7 h-7 rounded-full border border-white/80 flex items-center justify-center hover:bg-white/20 transition text-white" title="LinkedIn">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
              </a>
            </li>
            <li>
              <a href="#" class="w-7 h-7 rounded-full border border-white/80 flex items-center justify-center hover:bg-white/20 transition text-white" title="YouTube">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
              </a>
            </li>
            <li>
              <a href="#" class="w-7 h-7 rounded-full border border-white/80 flex items-center justify-center hover:bg-white/20 transition text-white" title="Spotify">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-.1.2-1.02-.36-.18-.6.36-1.02 1.02-1.2 4.2-1.26 11.28-1.02 15.72 1.62.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.56.3z"/></svg>
              </a>
            </li>
            <li>
              <a href="#" class="w-7 h-7 rounded-full border border-white/80 flex items-center justify-center hover:bg-white/20 transition text-white" title="TikTok">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.57-1.31 1.56-1.3 2.56.01.81.42 1.61 1.08 2.08.73.53 1.68.7 2.54.52.98-.18 1.83-.87 2.21-1.78.22-.51.32-1.07.31-1.63.02-4.81.01-9.62.01-14.43z"/></svg>
              </a>
            </li>
          </ul>

          <span class="hidden xl:block text-white/50 text-sm font-light mx-1">|</span>

          <div class="hidden sm:flex items-center gap-2">
            <button class="w-7 h-7 rounded-full border border-white/80 flex items-center justify-center hover:bg-white/20 transition cursor-pointer text-white bg-transparent" title="Alto Contraste">
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18V4a8 8 0 0 1 0 16z"/></svg>
            </button>
            <button class="w-7 h-7 rounded-full border border-white/80 flex items-center justify-center hover:bg-white/20 transition cursor-pointer text-white bg-transparent" title="Modo Escuro">
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </div>

          <form id="busca" class="flex items-center bg-white text-gray-700 rounded-full px-3.5 py-1 shadow-sm">
            <svg class="w-3.5 h-3.5 text-gray-600 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" placeholder="Busca" class="bg-transparent outline-none text-xs w-20 sm:w-28 md:w-36 text-gray-800 placeholder:text-gray-600 border-none p-0" />
          </form>

        </div>

      </div>

      <hr class="border-t border-white/30 my-3 hidden md:block" />

      <nav class="hidden md:block">
        <ul class="flex items-center gap-6 lg:gap-8 list-none m-0 p-0 text-[13px] font-bold tracking-wide">
          <li><a href="https://portal.ifrn.edu.br/processos-seletivos/buscar/" class="no-underline text-white hover:text-green-100 transition">Processos seletivos</a></li>
          <li><a href="https://portal.ifrn.edu.br/cursos/buscar/" class="no-underline text-white hover:text-green-100 transition">Cursos</a></li>
          <li><a href="https://portal.ifrn.edu.br/campus/" class="no-underline text-white hover:text-green-100 transition">Campi</a></li>
          <li><a href="https://portal.ifrn.edu.br/institucional/" class="no-underline text-white hover:text-green-100 transition">Institucional</a></li>
          <li><a href="https://portal.ifrn.edu.br/acesso-a-informacao/" class="no-underline text-white hover:text-green-100 transition">Acesso à Informação</a></li>
          <li><a href="https://portal.ifrn.edu.br/eventos/" class="no-underline text-white hover:text-green-100 transition">Eventos</a></li>
          <li><a href="https://portal.ifrn.edu.br/servicos/" class="no-underline text-white hover:text-green-100 transition">Serviços</a></li>
        </ul>
      </nav>

    </div>
  </header>

</body>
</html>
