
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Vue — Aula 01</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-6">

  <div id="app" class="card bg-base-100 shadow-2xl w-full max-w-md">
    <div class="card-body">

      <h1 class="card-title justify-center text-2xl mb-2">Calculadora Vue</h1>

      <!-- VISOR — {{ display }} mostra o estado reativo -->
      <div class="bg-base-300 rounded-box p-4 mb-4 min-h-16 flex items-center justify-end">
        <div class="text-3xl font-mono font-bold break-all">{{ display }}</div>
      </div>

      <!-- BOTÕES — cada um dispara um método via @click -->
      <div class="grid grid-cols-4 gap-2">

        <button class="btn btn-ghost text-xl" @click="appendDigit('7')">7</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('8')">8</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('9')">9</button>
        <button class="btn btn-primary text-xl" @click="setOperator('/')">÷</button>

        <button class="btn btn-ghost text-xl" @click="appendDigit('4')">4</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('5')">5</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('6')">6</button>
        <button class="btn btn-primary text-xl" @click="setOperator('*')">×</button>

        <button class="btn btn-ghost text-xl" @click="appendDigit('1')">1</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('2')">2</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('3')">3</button>
        <button class="btn btn-primary text-xl" @click="setOperator('-')">−</button>

        <button class="btn btn-error text-xl" @click="clear">C</button>
        <button class="btn btn-ghost text-xl" @click="appendDigit('0')">0</button>
        <button class="btn btn-accent text-xl" @click="calculate">=</button>
        <button class="btn btn-primary text-xl" @click="setOperator('+')">+</button>

      </div>
    </div>
  </div>

  <script>
    Vue.createApp({

      data() {
        return {
          display: '0',            // aparece no visor
          firstOperand: null,      // primeiro número da operação
          operator: null,          // '+', '-', '*' ou '/'
          waitingForSecond: false  // true = o próximo dígito substitui o visor
        }
      },

      // ==========================================
      // as ações da calculadora
      // ==========================================
      methods: {

        // Reseta a calculadora ao estado inicial.
        clear() {
          this.display = '0';
          this.firstOperand = null;
          this.operator = null;
          this.waitingForSecond = false;
        },

        // TODO 1 — Digita um dígito no visor.
        appendDigit(digit) {
          // Se estiver mostrando um erro, começa um novo número.
          if (this.display === 'Erro') {
            this.clear();
          }

          // Se estiver esperando o segundo número,
          // substitui o valor do visor pelo novo dígito.
          if (this.waitingForSecond) {
            this.display = digit;
            this.waitingForSecond = false;
          } else if (this.display === '0') {
            // Evita colocar zeros antes do número.
            this.display = digit;
          } else {
            // Junta o novo dígito ao número que já está no visor.
            this.display = this.display + digit;
          }
        },

        // TODO 2 — Registra o operador pendente.
        setOperator(op) {
          // Não faz nada se o visor estiver mostrando erro.
          if (this.display === 'Erro') {
            return;
          }

          // Se já existir uma operação pendente,
          // calcula primeiro o resultado dela.
          if (this.operator !== null && !this.waitingForSecond) {
            this.calculate();
          }

          // Guarda o primeiro número e o operador escolhido.
          this.firstOperand = parseFloat(this.display);
          this.operator = op;
          this.waitingForSecond = true;
        },

        // TODO 3 — Executa a operação pendente.
        calculate() {
          // Verifica se existe uma operação para calcular.
          if (this.operator === null || this.firstOperand === null) {
            return;
          }

          const a = this.firstOperand;
          const b = parseFloat(this.display);
          let resultado;

          // Realiza a operação escolhida.
          if (this.operator === '+') {
            resultado = a + b;
          } else if (this.operator === '-') {
            resultado = a - b;
          } else if (this.operator === '*') {
            resultado = a * b;
          } else if (this.operator === '/') {
            if (b === 0) {
              resultado = 'Erro';
            } else {
              resultado = a / b;
            }
          }

          // Mostra o resultado no visor.
          this.display = String(resultado);

          // Limpa os dados da operação anterior.
          this.firstOperand = null;
          this.operator = null;
          this.waitingForSecond = true;
        }

      }

    }).mount('#app')
  </script>
</body>
</html>
